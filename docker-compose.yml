services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deals
      POSTGRES_USER: deals
      POSTGRES_PASSWORD: deals   # local demo only
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deals -d deals"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/deals
      DB_USER: deals
      DB_PASSWORD: deals
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
